{{ define "main" }}
<section class="archive"><h1>{{ .Title }}</h1>
{{ range (where site.RegularPages "Section" "posts").ByDate.Reverse.GroupByDate "January 2006" }}
<h2>{{ .Key }}</h2>
<ul>{{ range .Pages }}<li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}</ul>
{{ end }}
</section>
{{ end }}
